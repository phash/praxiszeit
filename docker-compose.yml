# DSGVO/F-018: Dieses docker-compose.yml ist für lokale Entwicklung (HTTP).
# Für den Produktionseinsatz MUSS HTTPS aktiviert werden:
#   docker compose -f docker-compose.yml -f docker-compose.ssl.yml up -d
# Alternativ: TLS-Termination durch vorgelagerten Reverse-Proxy (nginx, Traefik).

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # F-025: passed to init-db-user.sh so it can ALTER ROLE praxiszeit_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      # PG18: das offizielle Image legt die Daten ab 18 standardmäßig in einem
      # Major-Version-Unterordner (/var/lib/postgresql/18/docker) ab. Wir setzen
      # PGDATA explizit auf den historischen Pfad, damit das bestehende Volume-
      # Layout (Mount auf .../data) unverändert bleibt.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 01_ prefix ensures the SQL runs before the shell script
      - ./backend/init-db-user.sql:/docker-entrypoint-initdb.d/01_init-db-user.sql
      - ./backend/init-db-user.sh:/docker-entrypoint-initdb.d/02_init-db-user.sh
    restart: unless-stopped
    networks:
      - praxiszeit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      TZ: Europe/Berlin
      # Must be explicitly set in .env — no default. `production` disables Swagger/ReDoc
      # and enforces the weak-admin-password check as hard failure (see backend/app/main.py).
      ENVIRONMENT: ${ENVIRONMENT:?Set ENVIRONMENT in .env (development or production)}
      DATABASE_URL: postgresql://${APP_DB_USER:-praxiszeit_app}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@db:5432/${POSTGRES_DB}
      DATABASE_URL_MIGRATIONS: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Admin}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Praxis}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5173}
      # Release-Review 1.19.1: ALLOWED_HOSTS stand in .env.example und in der
      # Sicherheitsdoku, wurde aber nie durchgereicht — im Docker-Betrieb blieb
      # der Host-Header-Schutz (TrustedHostMiddleware) damit wirkungslos, egal
      # was in der .env stand. Default '*' haelt Bestandsinstallationen gleich.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5/minute}
      REFRESH_RATE_LIMIT: ${REFRESH_RATE_LIMIT:-10/minute}
      DATA_EXPORT_RATE_LIMIT: ${DATA_EXPORT_RATE_LIMIT:-5/day}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-onprem}
      # Praxis-Stammdaten (erscheinen u.a. in Excel-Exporten, DSGVO F-016)
      PRACTICE_NAME: ${PRACTICE_NAME:-Praxis}
      PRACTICE_ADDRESS: ${PRACTICE_ADDRESS:-}
      HOLIDAY_STATE: ${HOLIDAY_STATE:-Bayern}
      # #213: Zielverzeichnis fuer DB-Backups (in das praxiszeit_backups-Volume).
      PRAXISZEIT_BACKUP_DIR: ${BACKUP_DIR:-/app/backups}
    volumes:
      # #213: persistente DB-Backups (pg_dump --clean --if-exists | gzip)
      - praxiszeit_backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - praxiszeit-network

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      grafana:
        condition: service_started
    restart: unless-stopped
    networks:
      - praxiszeit-network

  prometheus:
    # F-037: pinned to a specific minor version for reproducible builds.
    # Bump deliberately via Dependabot/Renovate, not via `docker pull`.
    # #175: v2.54 war seit 2024-09 EOL -> auf v3 LTS-Linie. Config ist minimal
    # (global + ein scrape-job) und v3-kompatibel (promtool check config gruen).
    image: prom/prometheus:v3.12.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    networks:
      - praxiszeit-network

  grafana:
    # F-037: pinned
    # v13 requirements we already satisfy: dashboards reference data sources by
    # UID (not numeric id — that deprecated API is disabled by default in v13),
    # and we don't rely on the ability to disable the Scenes-powered dashboard
    # runtime (in v13 the feature toggle to turn it off was removed; Scenes is
    # always-on). Startup performs a one-time dashboard/folder migration to
    # unified storage.
    # 2026-07-31 (Abhaengigkeits-Audit): 13.0.1-security-01 -> 13.0.4. Bleibt auf
    # der 13.0-Linie (13.1.x waere ein Minor-Sprung und braucht eine eigene
    # Bewertung). 13.0.4 enthaelt die CVEs des Sonderbuilds 13.0.1-security-01
    # (2026-05-12) und zusaetzlich die sieben CVEs aus 13.0.2 (2026-06-09).
    image: grafana/grafana:13.0.4
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - praxiszeit-network

volumes:
  # §16 ArbZG: Zeitaufzeichnungen müssen mind. 2 Jahre aufbewahrt werden.
  # Dieses Volume NICHT löschen ohne vorheriges Backup und Prüfung der Aufbewahrungspflicht.
  # Backup-Anleitung: siehe INSTALLATION.md → "Gesetzliche Aufbewahrungspflichten"
  postgres_data:
  prometheus_data:
  grafana_data:
  # #213: DB-Backups (manuell + geplant). NICHT zusammen mit postgres_data loeschen.
  praxiszeit_backups:

networks:
  praxiszeit-network:
    driver: bridge
