# HTTP -> HTTPS Redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Limit request body size (profile picture uploads up to ~500KB;
    # XLS-Import: eigene location mit 6M weiter unten)
    client_max_body_size 2M;

    # SSL certificates (mounted from host via docker-compose)
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS 1.2 nur mit ECDHE (Forward Secrecy) + AEAD (GCM/ChaCha20-Poly1305);
    # "HIGH:!aNULL:!MD5" liess auch CBC-/SHA1- und Nicht-PFS-Suiten (RSA-Kex)
    # zu. ssl_ciphers wirkt nur auf TLS 1.2 — die TLS-1.3-Suiten bleiben auf
    # dem OpenSSL-Standard (alle AEAD). Liste = Mozilla "intermediate" ohne DHE.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # Bei einer reinen AEAD-Liste darf der Client waehlen (Mozilla-Empfehlung).
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Block metrics endpoint (internal only, accessed by Prometheus via Docker network)
    location = /api/metrics {
        deny all;
        return 404;
    }

    # Release-Review 1.20.1: der XLS-Import verspricht 5 MB (import_xls.py,
    # UI, Handbuch). Nur dieser Pfad bekommt 6 MB (Multipart-Overhead); die
    # Server-Grenze von 2M bleibt fuer alles andere (Login/Signup/JSON ohne
    # eigenes Limit). Gegenstueck im Backend: RequestSizeLimitMiddleware
    # path_limits in app/main.py. proxy_* wird nicht vererbt -> hier wiederholt.
    location ^~ /api/admin/import/ {
        client_max_body_size 6M;
        proxy_pass http://backend:8000/api/admin/import/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    # API Reverse Proxy
    # #443: ^~ statt reinem Prefix — ohne den Modifier gewinnt die spätere
    # Regex-Location `~* \.pdf$` (für Handbuch-/Cheat-Sheet-PDFs) gegen JEDEN
    # `/api/...pdf`-Pfad (Prefix- vs. Regex-Priorität in nginx), noch bevor
    # der Request den Backend-Proxy erreicht -> 404 statt 401/403 für
    # GET /api/shift-planning/plans/{id}/export.pdf. ^~ stoppt die
    # Regex-Suche, sobald dieser Prefix der längste Treffer ist.
    location ^~ /api/ {
        proxy_pass http://backend:8000/api/;
        # $http_host (mit Port) statt $host: erhält den Port in absoluten
        # Redirect-URLs (FastAPI 307 Trailing-Slash). Schema kommt korrekt via
        # X-Forwarded-Proto (uvicorn läuft mit --proxy-headers). Sonst verliert
        # der 307 den Port -> Redirect schlägt fehl -> Dashboard-Ladefehler.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    # Service Worker - must not be cached
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        # nginx-Vererbung: ein add_header im location-Block verwirft die
        # Server-Level-Header → nosniff hier wiederholen (DSGVO-Audit M).
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # PWA manifest
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        types {
            application/manifest+json webmanifest;
        }
        try_files $uri =404;
    }

    # Static assets (JS, CSS) - long cache with hashed filenames
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Grafana Reverse Proxy (restricted to private networks)
    location /grafana/ {
        # 172.16.0.0/12 deckt auch das Docker-Bridge-Gateway ab (172.17-31.x.1).
        # Hinter einem Reverse-Proxy AUF DEM HOST (Caddy/nginx -> localhost:80)
        # kommt JEDE Anfrage mit dieser Gateway-Adresse an, auch aus dem
        # Internet — die Liste schuetzt dann nicht. Das Compose-Netz hat kein
        # festes Subnetz, und ohne diese Zeile wuerde auch der Aufruf vom
        # Docker-Host selbst (http://localhost/grafana/) gesperrt. Grafana hat
        # zusaetzlich einen eigenen Login (anonym aus). Wer einen Host-Proxy
        # betreibt: /grafana/ dort sperren oder auf eigene Netze begrenzen.
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://grafana:3000/grafana/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana WebSocket (Live features)
    location /grafana/api/live/ {
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://grafana:3000/grafana/api/live/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # PDF documents (Handbücher, Cheat-Sheets) - serve directly, not via SPA fallback
    location ~* \.pdf$ {
        try_files $uri =404;
    }

    # index.html - must not be cached so clients always get latest version
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        # HTML-Dokument: voller Security-Header-Satz hier wiederholen (ein
        # add_header im location-Block verwirft die Server-Level-Header).
        # CSP byte-identisch zum Server-Block + static_serving.py halten (Audit M).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # SPA routes that conflict with static directories must be declared explicitly
    # /help/ contains markdown docs; /help (no slash) is a React route
    location = /help {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # HTML-Dokument: voller Security-Header-Satz (s. /index.html).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Frontend - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # X-XSS-Protection intentionally omitted — deprecated, superseded by CSP
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss application/manifest+json;
}
